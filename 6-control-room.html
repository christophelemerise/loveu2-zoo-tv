<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>LOVEU2 · Control Room</title>
<meta name="description" content="LOVEU2 – The U2 Experience. U2 tribute band from Canada, performing worldwide.">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo+Black&family=VT323&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="zoo.css">
<style>
.hero{position:relative;min-height:100svh;padding:80px 16px 24px;background:#070707;display:grid;align-content:center;gap:12px}
.desk{width:min(1400px,100%);margin:0 auto;display:grid;grid-template-columns:2fr 1fr;gap:12px}
@media(max-width:860px){.desk{grid-template-columns:1fr}}
.mon{position:relative;background:#111;border-radius:16px;padding:10px 10px 34px}
.mon .tv{aspect-ratio:16/10;border-radius:10px}
.mon .tv img{object-position:50% 25%}
.mon .lb{position:absolute;left:14px;bottom:8px;font:22px VT323;display:flex;gap:10px;align-items:center}
.mon .tally{display:inline-block;padding:2px 10px;border-radius:6px;font:20px VT323;color:#000}
.pgm .tally{background:var(--red);color:#fff;box-shadow:0 0 14px var(--red)}
.pvw .tally{background:var(--g)}
.right{display:grid;gap:12px;align-content:start}
.right .ttl{padding:16px;border-radius:16px;background:#111}
.right .ttl .gt{font-size:clamp(46px,5.4vw,90px)}
.right .ttl .tag{font:24px VT323;color:var(--yl);margin-top:8px}
.cams{width:min(1400px,100%);margin:0 auto;display:grid;grid-template-columns:repeat(6,1fr);gap:8px}
@media(max-width:860px){.cams{grid-template-columns:repeat(3,1fr)}}
.cam{position:relative;background:#111;border:0;border-radius:12px;padding:6px 6px 26px;cursor:pointer;color:#ddd;transition:background .15s}
.cam .tv{aspect-ratio:4/3;border-radius:8px}
.cam span{position:absolute;left:10px;bottom:4px;font:20px VT323}
.cam:hover,.cam.on{background:var(--g);color:#000}
.cam.live{background:var(--red);color:#fff}
</style>
</head>
<body>
<nav class="nav">
  <a class="lg" href="#top"><img src="img/logo.png" alt="LOVEU2"></a>
  <div class="r"><a class="k" href="#dates">DATES</a><a class="k" href="#photos">PHOTOS</a><a class="k" href="#video">VIDEO</a><a class="k" href="#booking">BOOKING</a><a class="k cta onair" href="#dates"><i></i>TICKETS</a></div>
</nav>

<header class="hero" id="top">
  <div class="desk">
    <div class="mon pgm"><div class="tv" id="pgm"><img src="img/p00081.jpg" alt="LOVEU2 singer"><div class="st"></div><div class="rec"><i></i>ON AIR</div></div><div class="lb"><span class="tally">PGM</span><span id="pgmL">CAM 1</span></div></div>
    <div class="right">
      <div class="mon pvw"><div class="tv" id="pvw"><img src="img/p00030.jpg" alt=""><div class="st"></div></div><div class="lb"><span class="tally">PVW</span><span id="pvwL">CAM 2</span></div></div>
      <div class="ttl"><h1 class="gt" data-t="LOVEU2">LOVEU2</h1><div class="tag"><span id="type"></span><span class="cursor"></span></div></div>
    </div>
  </div>
  <div class="cams" id="cams"></div>
</header>

<div class="ticker"><div id="tickerI"></div></div>

<section class="air">
  <div class="wrap">
    <div><div class="k onair"><i></i>NEXT BROADCAST</div><div class="city" id="aCity"></div><div class="venue" id="aVenue"></div></div>
    <div class="clock" id="clock"></div>
    <a class="pill" id="aBtn" target="_blank" rel="noopener">Get tickets ▶</a>
  </div>
</section>

<section class="sec" id="dates">
  <div class="wrap">
    <div class="kick">&gt; DEPARTURES · WORLD TOUR</div>
    <h2 class="h">Upcoming <span class="y">shows</span></h2>
    <div class="flaps" id="flaps"></div>
    <details class="archive"><summary id="archT"></summary><div class="arch" id="arch"></div></details>
  </div>
</section>

<section class="sec" id="photos" style="padding-top:0">
  <div class="wrap">
    <div class="kick">&gt; 74 CHANNELS · CLICK TO WATCH</div>
    <h2 class="h">The <span class="gr">TV</span> <span class="or">wall</span></h2>
    <div class="tvwall" id="tvwall"></div>
  </div>
</section>

<section class="sec" id="video" style="padding-top:0">
  <div class="wrap">
    <div class="kick">&gt; PLAYBACK</div>
    <h2 class="h">Watch <span class="gr">the</span> <span class="or">show</span></h2>
    <div class="vid" id="vid" role="button" tabindex="0" aria-label="Play video"><img id="vthumb" alt="" onerror="this.src='img/p00098.jpg'"><div class="rec"><i></i>REC</div><div class="pl">▶ PLAY</div></div>
  </div>
</section>

<section class="sec" id="booking" style="padding-top:0">
  <div class="wrap">
    <div class="kick">&gt; SELECT YOUR CHANNEL</div>
    <h2 class="h">Book <span class="y">LOVEU2</span></h2>
    <div class="chs" id="chs"></div>
  </div>
</section>
<footer><div class="wrap"><span>© LOVEU2 · THE U2 EXPERIENCE</span><a href="https://www.facebook.com/loveU2.ca" target="_blank" rel="noopener">FACEBOOK ▶</a></div></footer>

<script src="data.js"></script>
<script src="common.js"></script>
<script src="photos.js"></script>
<script src="zoo.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/ScrollTrigger.min.js"></script>
<script>
var L = window.LOVEU2, U = L.upcoming, Z = window.ZOO, RM = Z.RM, N = Z.next;
Z.fill();
Z.type(document.getElementById('type'), ['THE U2 EXPERIENCE', 'CLICK A CAMERA TO CUE IT', 'NEXT: ' + L.place(N.city).toUpperCase()]);
/* La régie : six caméras ; on en met une en préparation (PVW), puis elle passe à l'antenne (PGM) */
var CAMS = ['p00081', 'p00030', 'p00087', 'p00099', 'p00050', 'p00003'], cams = document.getElementById('cams'), pg = 0, pv = 1;
cams.innerHTML = CAMS.map(function (p, i) { return '<button class="cam" data-i="' + i + '"><div class="tv"><img src="img/s/' + p + '.jpg" alt=""><div class="st"></div></div><span>CAM ' + (i + 1) + '</span></button>'; }).join('');
var pgm = document.getElementById('pgm'), pvw = document.getElementById('pvw');
function marks() { cams.querySelectorAll('.cam').forEach(function (c, i) { c.classList.toggle('live', i === pg); c.classList.toggle('on', i === pv); }); document.getElementById('pgmL').textContent = 'CAM ' + (pg + 1); document.getElementById('pvwL').textContent = 'CAM ' + (pv + 1); }
function cue(i) { if (i === pg) return; pv = i; Z.zap(pvw, 'img/' + CAMS[pv] + '.jpg'); marks(); }
function cut() { var old = pg; pg = pv; pv = old; Z.zap(pgm, 'img/' + CAMS[pg] + '.jpg'); Z.zap(pvw, 'img/' + CAMS[pv] + '.jpg'); marks(); if (!RM) gsap.fromTo('#pgm', { scale: 1.02 }, { scale: 1, duration: .3 }); }
cams.addEventListener('click', function (e) { var c = e.target.closest('.cam'); if (!c) return; cue(+c.dataset.i); clearTimeout(cams.t); cams.t = setTimeout(cut, 900); });
marks();
/* Sans intervention, le réalisateur coupe tout seul toutes les quelques secondes */
if (!RM) setInterval(function () { if (Date.now() - (cams.last || 0) < 4000) return; var n; do { n = Math.floor(Math.random() * CAMS.length); } while (n === pg); cue(n); setTimeout(cut, 900); }, 3600);
cams.addEventListener('pointerdown', function () { cams.last = Date.now(); });
if (!RM) gsap.timeline({ delay: .1 }).from('.mon', { scaleY: .02, opacity: 0, duration: .4, ease: 'power4.out', stagger: .12 }).from('.cam', { y: 30, opacity: 0, duration: .35, stagger: .05, ease: 'back.out(2)', clearProps: 'transform,opacity' }, .3).from('.right .ttl', { x: 40, opacity: 0, duration: .5 }, .4);
Z.animate();
</script>
</body>
</html>
