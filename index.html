<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>LOVEU2 · Zoo TV</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo+Black&family=VT323&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="zoo.css">
<style>
.top{padding:40px 0 10px}
.top .gt{font-size:clamp(56px,10vw,150px)}
.top p{font:24px/1.4 VT323;color:#ccc;margin-top:14px;max-width:60ch}
.list{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(300px,100%),1fr));gap:14px;margin:30px 0 70px}
.it{display:block;background:#111;border-radius:22px;padding:10px 10px 16px;transition:translate .2s,background .2s}
.it:hover{translate:0 -6px;background:#1a1a1a}
.it .tv{aspect-ratio:4/3}
.it .tv img{object-position:50% 25%}
.it b{display:block;font:400 26px/1 "Archivo Black";text-transform:uppercase;margin:14px 6px 6px}
.it span{display:block;font:20px/1.2 VT323;color:#aaa;margin:0 6px}
.it:hover b{color:var(--yl)}
</style>
</head>
<body>
<div class="wrap top">
  <div class="kick">&gt; LOVEU2 · ZOO TV · 8 CHANNELS</div>
  <h1 class="gt" data-t="ZOO TV">ZOO TV</h1>
  <div class="tri" style="max-width:420px"><b></b><b></b><b></b></div>
  <p>Huit layouts dans le style du layout 2 (Zoo TV). Les photos sont en pleine lumière et le chanteur est toujours bien visible. Chaque page a aussi le mur des 74 photos en télés.</p>
  <div class="list" id="list"></div>
</div>
<script src="data.js"></script>
<script src="common.js"></script>
<script src="photos.js"></script>
<script src="zoo.js"></script>
<script>
var Z = window.ZOO;
var P = [['1-broadcast', 'Broadcast', 'Le chanteur en plein écran, dans une interface de caméra en direct', 'p00081'], ['2-multiscreen', 'Multiscreen', 'Un mur de télés, le chanteur sur l\'écran géant du centre', 'p00087'], ['3-channel-surf', 'Channel Surf', 'Une grosse télé qui zappe, avec une télécommande qui marche', 'p00099'], ['4-jumbotron', 'Jumbotron', 'L\'écran géant à LED de l\'aréna et ses écrans latéraux', 'p00003'], ['5-split-signal', 'Split Signal', 'Le portrait en rouge, vert, bleu qui se recompose sous la souris', 'p00030'], ['6-control-room', 'Control Room', 'La régie : PGM, PVW, et des caméras sur lesquelles on clique', 'p00050'], ['7-vertical-feed', 'Vertical Feed', 'Trois écrans verticaux de portraits, comme des stories', 'p00005'], ['8-video-wall', 'Video Wall', 'Une seule photo répartie sur quinze télés', 'p00011']];
document.getElementById('list').innerHTML = P.map(function (p, i) { return '<a class="it" href="' + p[0] + '.html"><div class="tv"><img src="img/s/' + p[3] + '.jpg" alt=""><div class="st"></div><div class="ch">CH ' + (i + 1) + '</div></div><b>' + p[1] + '</b><span>' + p[2] + '</span></a>'; }).join('');
var tvs = document.querySelectorAll('.it .tv');
document.getElementById('list').addEventListener('mouseover', function (e) { var t = e.target.closest('.it'); if (t && !Z.RM) Z.zap(t.querySelector('.tv')); });
if (!Z.RM) setInterval(function () { Z.zap(tvs[Math.floor(Math.random() * tvs.length)]); }, 900);
</script>
</body>
</html>
